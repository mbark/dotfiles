[tools]
"aqua:mitsuhiko/insta" = "latest"
"github:can1357/oh-my-pi" = "latest"
kind = "latest"
"npm:@alibaba-group/open-code-review" = "latest"
rust = "latest"
"aqua:pre-commit/pre-commit" = "latest"
"github:nextest-rs/nextest" = "latest"

[env]
TESTBOI_OFFLOAD_MIN_PACKAGES = "60"

# GOCACHE budget for this machine. The shipped testboi defaults (100G max, 70G
# target) assume a couple of checkouts; this laptop carries ~17 worktrees, whose
# combined live set runs past them, and a budget under the live set makes every
# prune evict the archives the next run needs. 398G free as of 2026-09-02.
TESTBOI_CACHE_MAX = "200G"
TESTBOI_CACHE_TARGET = "150G"

# Floor for go invocations that testboi does not wrap - a script an agent writes
# and then runs, an IDE build, a manual one-off. testboi itself always passes an
# explicit -p, which wins over this, so its own runs are unaffected.
GOFLAGS = "-p=4"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
